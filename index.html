<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix.exe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="desktop">
        <button class="app-icon" data-window="jobs-window">Jobs</button>
        <button class="app-icon" data-window="tracking-window">Tracking</button>
        <button class="app-icon" data-window="workbench-window">Workbench</button>

        <div class="window" id="jobs-window" hidden>
            <div class="titlebar">
                <span>Jobs</span>
                <button class="close-button">x</button>
            </div>
            <div class="window-body">
                <div class="address-bar">www.fixjobs.net</div>
                <h2>FixJobs</h2>
                <div id="job-list"></div>
                <h3>Accepted jobs</h3>
                <div id="accepted-list"></div>
            </div>
        </div>
        
        <div class="window" id="tracking-window" hidden>
            <div class="titlebar">
                <span>Tracking</span>
                <button class="close-button">x</button>
            </div>
            <div class="window-body">
                <div class="address-bar">www.parceltrack.net</div>
                <h2>ParcelTrack</h2>
                <p>Enter your tracking ID</p>
                <input type="text" id="tracking-input" placeholder="PX-00000-IN">
                <button id="track-button">Track</button>
                <div id="tracking-result"></div>
            </div>
        </div>

        <div class="window" id="workbench-window" hidden>
            <div class="titlebar">
                <span>Workbench</span>
                <button class="close-button">x</button>
            </div>
            <div class="window-body">
                <div id="repair-list"></div>
            </div>
        </div>

        <div id="job-popup" hidden>
            <div id="popup-box">
                <div class="popup-bar">
                    <span>Job details</span>
                    <button id="popup-close">x</button>
                </div>
                <div class="popup-details">
                    <p id="popup-customer"></p>
                    <p id="popup-story"></p>
                    <p id="popup-contact"></p>
                    <p id="popup-link"></p>
                    <p id="popup-pay"></p>
                </div>
                <div class="popup-actions">
                    <button id="accept-button">Accept</button>
                    <button id="later-button">Later</button>
                </div>
            </div>
        </div>

        <div id="repair-stage" hidden>
            <button id="leave-button">← Leave repair</button>

            <div id="frequency-game" hidden>
                <div class="phone">
                    <canvas id="static-canvas" width="240" height="400"></canvas>
                </div>
                <div class="control-panel">
                    <h3>Signal</h3>
                    <p id="signal-text"></p>

                    <div class="slider-row">
                        <label for="slider-wobble">Wobble</label>
                        <input type="range" id="slider-wobble" min="0" max="100">
                    </div>

                    <div class="slider-row">
                        <label for="slider-static">Static</label>
                        <input type="range" id="slider-static" min="0" max="100">
                    </div>

                    <div class="slider-row">
                        <label for="slider-roll">Roll</label>
                        <input type="range" id="slider-roll" min="0" max="100">
                    </div>
                </div>
            </div>
            <p id="stage-caption"></p>
        </div>

        <div id="notice" hidden></div>
    </main>

    <footer id="taskbar">
        <span id="day">Day 1</span>
        <span id="money">$0</span>
        <span id="clock">09:00</span>
    </footer>
    
    <script src="jobs.js"></script>
    <script src="script.js"></script>
</body>
</html>
